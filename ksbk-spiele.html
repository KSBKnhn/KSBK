<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>KSBK-Spiele 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f5f5f7;--card:#ffffff;--card2:#eeeef2;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;
  --accent:#0a84ff;--accent-soft:#e5f1ff;--dark:#1d1d1f;--dark-text:#ffffff;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(245,245,247,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.top .sub{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.teambtn{display:flex;align-items:center;gap:8px;white-space:nowrap;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 12px 6px 6px;font-weight:600;font-size:14px;min-height:44px}
.teambtn .d{width:32px;height:32px}
.dot{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
main{flex:1;padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px))}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
h2{font-size:26px;font-weight:800;letter-spacing:-.025em;margin:10px 0 6px;line-height:1.1;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px}
.lead b{color:var(--text);font-weight:600}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
/* team grid */
.tgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:520px){.tgrid{grid-template-columns:1fr 1fr}}
.tbtn>span:nth-child(2){min-width:0;display:flex;align-items:baseline;gap:8px}
.tbtn{display:grid;grid-template-columns:44px minmax(0,1fr) 14px;min-width:0;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:9px 12px;min-height:60px;text-align:left;transition:transform .15s}
.tbtn .chev{color:#c7c7cc;font-size:22px;font-weight:600;text-align:center;line-height:1}
.tbtn:active{transform:scale(.97)}
.tbtn .d{width:44px;height:44px;font-size:18px}
.tbtn .n{font-weight:700;font-size:16px;line-height:1.1}
.tbtn .s{font-size:12px;color:var(--muted);margin-top:2px}
/* now card */
.now{border-radius:20px;padding:14px 16px;position:relative;overflow:hidden}
.now .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.8;display:flex;justify-content:space-between}
.now .hd{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:6px}
.now .big{font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1;width:64px;text-align:center}
.now .sn{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.now .sw{font-size:13px;opacity:.8;margin-top:2px}
.now .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.now .chip{background:rgba(127,127,127,.22);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.now .chip .dot{width:18px;height:18px;font-size:10px}
.now .next{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;background:#fff;color:var(--text);font-weight:700;font-size:15px;border-radius:12px;padding:12px;min-height:50px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.now .next .arr{display:inline-block;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.now .undo{color:inherit}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(10,132,255,.35)}50%{box-shadow:0 0 0 8px rgba(10,132,255,0)}}
.tap{font-size:12px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.tap .arr{display:inline-block;animation:nudge 1.4s ease-in-out infinite}
.now .undo{display:block;margin:6px auto 0;font-size:12.5px;font-weight:600;opacity:.8;padding:6px 10px;min-height:32px}
.now.done{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.now.done .big{font-size:26px;width:auto;text-align:left;margin-top:4px}
.now.done .big{font-size:40px;margin:8px 0 6px}
/* round list */
.rc{display:grid;grid-template-columns:52px 64px 1fr 26px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;overflow:hidden;min-height:78px;text-align:left;width:100%;transition:opacity .2s}
.rc .chev{display:flex;align-items:center;justify-content:center;color:#c7c7cc;font-size:22px;font-weight:600}
.rc.past{opacity:.45}
.rc.cur{box-shadow:0 0 0 2.5px var(--accent),var(--shadow)}
.rc .r{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px}
.rc .r .k{font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.rc .r .v{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.rc .r .t{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.rc .s{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;letter-spacing:-.03em}
.rc .i{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.rc .i .sn{font-weight:700;font-size:16px;letter-spacing:-.01em}
.rc .i .sw{font-size:12px;color:var(--muted)}
.rc .i .hint{font-size:11px;color:var(--accent);font-weight:600;margin-top:3px}
.rc .i .op{font-size:13px;margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rc .i .op .dot{width:16px;height:16px;font-size:9px}
.rc .i .op .st{margin-left:auto;background:var(--card2);border-radius:8px;padding:2px 8px;font-weight:700;font-size:12px;white-space:nowrap}
/* stations */
.sbtn{display:grid;grid-template-columns:56px 1fr 24px;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:12px;min-height:72px;text-align:left;width:100%}
.sbtn .l{font-size:30px;font-weight:800;color:var(--accent);letter-spacing:-.03em;text-align:center}
.sbtn .n{font-weight:700;font-size:16px}
.sbtn .w{font-size:12.5px;color:var(--muted)}
.sbtn .chev{color:#c7c7cc;font-size:22px;font-weight:600;text-align:center}
.sbtn .w:after{content:' · Regeln ansehen';color:var(--accent);font-weight:600}
.note{background:var(--card);border-radius:18px;padding:16px;font-size:14.5px;line-height:1.5;box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.note b{font-weight:700}
/* timeline */
.tl{display:flex;flex-direction:column;gap:8px}
.tl .it{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start}
.tl .tm{font-weight:800;font-size:16px;letter-spacing:-.02em;padding-top:12px;font-variant-numeric:tabular-nums}
.tl .tm.sm{font-size:13px;color:var(--muted);font-weight:700}
.tl .bx{background:var(--card);border-radius:14px;padding:12px 14px}
.tl .bx.hl{background:var(--accent);color:#fff}
.tl .bx .t{font-weight:700;font-size:15px}
.tl .bx .s{font-size:13px;color:var(--muted);margin-top:2px}
.tl .bx.hl .s{color:rgba(255,255,255,.85)}
.tl a{color:inherit}
/* plan table */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.plan{border-collapse:separate;border-spacing:4px;font-size:13px;min-width:520px}
table.plan th{background:var(--card);border-radius:10px;padding:8px 6px;text-align:center;font-size:12px}
table.plan th b{display:block;font-size:16px;color:var(--accent);font-weight:800}
table.plan td{background:var(--card);border-radius:10px;padding:8px 4px;text-align:center;white-space:nowrap}
table.plan td.r{background:var(--dark);color:var(--dark-text);font-weight:800;font-size:15px}
table.plan td .dot{width:14px;height:14px;font-size:8px;vertical-align:middle}
table.plan .vs{color:var(--muted);font-size:10px;margin:0 3px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;font-size:11.5px;font-weight:600;color:#6e6e73;min-height:56px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);background:var(--accent-soft)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{background:#fff;width:100%;max-width:560px;max-height:88%;border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateY(30px);transition:transform .2s}
.scrim.open .sheet{transform:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sheet .close{background:var(--card2);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;min-height:44px}
.sheet h3{font-size:24px;font-weight:800;letter-spacing:-.025em;margin:4px 0 4px}
.sheet .big{font-size:56px;font-weight:800;color:var(--accent);letter-spacing:-.04em;line-height:1}
.sheet .desc{color:var(--muted);margin:0 0 14px}
.sheet h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:16px 0 8px;font-weight:700}
.sheet ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sheet ol li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:15px}
.sheet ol li span{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.sheet .mat{background:var(--card);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.hp{border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);position:relative;width:100%;display:block;padding:0}
.hp .zl{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.95);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hp img{display:block;width:100%;height:auto}
.zoom{position:fixed;inset:0;background:#000;z-index:30;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom.open{display:block}
.zoom img{width:180%;max-width:none;display:block}
.zoom .close{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:#fff;color:#000;border-radius:999px;padding:10px 16px;font-weight:700;min-height:44px}
.small{font-size:13px;color:var(--muted)}
.mt{margin-top:16px}
.linkbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;text-decoration:none;color:inherit;min-height:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div><h1>KSBK-Spiele</h1><div class="sub">Studientag · 1. Oktober 2026 · Sportfachschaft</div></div>
    <button class="teambtn" id="teamBtn" aria-label="Team wählen oder ändern"><span class="dot d" id="teamDot" style="background:var(--card2)">?</span><span id="teamLbl">Mein Team</span></button>
  </header>
  <main id="main"></main>
  <nav aria-label="Bereiche"><div class="in">
    <button data-v="lauf" aria-label="Laufzettel"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.5"/><circle cx="4.5" cy="12" r="1.5"/><circle cx="4.5" cy="18" r="1.5"/></svg>Laufzettel</button>
    <button data-v="plan" aria-label="Hallenplan"><svg viewBox="0 0 24 24"><path d="M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2z"/><path d="M9 3v16M15 5v16"/></svg>Hallenplan</button>
    <button data-v="stat" aria-label="Stationen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>Stationen</button>
    <button data-v="tag" aria-label="Ablauf"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Ablauf</button>
  </div></nav>
</div>

<div class="scrim" id="scrim" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="zoom" id="zoom"><button class="close" id="zoomClose">Schließen</button><img id="zoomImg" alt="Hallenplan vergrößert"></div>

    {n:4,name:"Lila",hex:"#3a2b8c",fg:"#fff"},{n:5,name:"Hellgrün",hex:"#7fe59a",fg:"#1d1d1f"},{n:6,name:"Braun",hex:"#7a4a30",fg:"#fff"},
    {n:7,name:"Dunkelgrün",hex:"#2f4a32",fg:"#fff"},{n:8,name:"Rosa",hex:"#f3b6c6",fg:"#1d1d1f"},{n:9,name:"Gelb",hex:"#e9d25a",fg:"#1d1d1f"},
    {n:10,name:"Hellblau",hex:"#5fb2ea",fg:"#1d1d1f"},{n:11,name:"Grau",hex:"#7d7d7d",fg:"#fff"},{n:12,name:"Schwarz",hex:"#151515",fg:"#fff"}],
  stations:{
    A:{name:"Tossit",where:"Feld links",form:"5 gegen 5",desc:"Das Boule-Prinzip mit Saugnapf-Pfeilen: Platziert euren Wurfpfeil möglichst nah am schwarzen Marker.",
      steps:["Alle stellen sich hinter die Startlinie; jede und jeder erhält einen Wurfpfeil.","Ein Team beginnt und wirft den schwarzen Marker auf den Boden.","Danach werfen die Teams abwechselnd ihre Pfeile – so nah wie möglich an den Marker.","Alle Pfeile bleiben stehen bzw. liegen, bis die Runde beendet ist.","Es gewinnt das Team, dessen Pfeil dem Marker am nächsten ist. Umgefallene, nicht haftende Pfeile zählen nicht."],

    B:{name:"Cornhole",where:"Feld links",form:"5 gegen 5",desc:"Werft eure Säckchen so, dass sie auf dem schrägen Holzbrett liegen bleiben – am besten direkt im Loch.",
      steps:["Alle stellen sich hinter die Startlinie. Jedes Teammitglied erhält ein Säckchen in der eigenen Teamfarbe.","Die Teams werfen immer abwechselnd.","Alle Säckchen bleiben liegen, bis die Runde beendet ist.","Punkte: auf dem Brett 1 Punkt, auf der roten Fläche 2 Punkte, im Loch 3 Punkte.","Schubst ihr ein gegnerisches Säckchen ins Loch, zählen die Punkte für den Gegner.","Berührt ein Säckchen zuerst den Boden, zählt es nicht und wird vom Brett entfernt."],
      win:"Das Team mit den meisten gewonnenen Durchgängen bekommt die Steine – bei Gleichstand entscheidet die Gesamtpunktzahl.",mat:"Cornhole-Brett · Säckchen in 2 Farben · Startlinie · Schmierblatt & Stift"},
    C:{name:"Leitergolf",where:"Feld Mitte",form:"1 gegen 1",desc:"Werft die Bolas – zwei durch eine Schnur verbundene Bälle – so, dass sie sich um eine Leitersprosse wickeln. Wer zuerst exakt 15 Punkte hat, gewinnt.",
      steps:["Ihr werft abwechselnd von der 5-Meter-Linie. Die Bolas müssen sich um eine Sprosse wickeln und hängen bleiben.","Punkte: oberste Sprosse 3, mittlere 2, unterste 1 Punkt.","Gezählt wird erst am Rundenende – bereits hängende Bolas dürfen also heruntergeworfen werden.","Überwerfen-Risiko: Die 15 muss exakt getroffen werden. Wer darüber liegt, verliert die Punkte des letzten Wurfs."],
      win:"Das Team mit den meisten gewonnenen Durchgängen bekommt die Steine.",mat:"Leitergolf-Gerüst · 6 Bolas · 5-m-Startlinie · Schmierblatt & Stift"},
    D:{name:"Sport-Quiz",where:"Feld rechts",form:"5 gegen 5",desc:"16 Fragen rund um Sport und Freizeit – beraten, abstimmen und als Team die richtige Antwort wählen: A, B, C oder D?",
      steps:["Die Fragen werden den Teams abwechselnd gestellt – insgesamt 16 Fragen, also 8 pro Team.","Pro Frage gibt es die Antwortmöglichkeiten A, B, C und D und 30 Sekunden Beratungszeit.","Das Team gibt eine abgestimmte Antwort. Bei falscher Antwort darf das gegnerische Team übernehmen.","Bei Punktgleichheit entscheidet eine Schätzfrage: Wer näher an der Lösung liegt, gewinnt."],
      win:"Das Team mit den meisten richtigen Antworten bekommt die Steine.",mat:"Trivial-Pursuit-Karten · Stoppuhr · Schmierblatt & Stift"},
    E:{name:"Gummischeiben-Weitwurf",where:"Feld Mitte",form:"1 gegen 1",desc:"Acht Scheiben, acht Würfe – und jeder Wurf muss etwas weiter fliegen als der davor. Hier gewinnt Feingefühl, nicht Kraft.",
      steps:["Ihr steht hinter der Startlinie und werft eure ca. 8 Gummischeiben nacheinander in den Korridor.","Jede Scheibe muss weiter landen als die vorherige – dosiert eure Kraft also klug.","Landet eine Scheibe überlappend auf der vorherigen, zählt der Wurf.","Ist ein Wurf zu kurz oder verlässt er den Pylonen-Korridor, ist die Runde für euch verloren."],
      win:"Das Team mit den meisten gewonnenen Durchgängen bekommt die Steine.",mat:"2×8 Gummischeiben · Pylonen · Startlinie · Schmierblatt & Stift"},
    F:{name:"Musik erraten",where:"Nebenraum im Keller · Treppe runter",form:"1 gegen 1",desc:"Bekannte Songs, zwei Buzzer, schnelle Ohren: Wer zuerst drückt, nennt Titel und Interpret – und holt den Punkt.",
      steps:["Zwei Teams treten in 1-gegen-1-Duellen an – jede und jeder kommt an die Reihe.","Über die Hitstar-App werden bekannte Songs abgespielt.","Wer zuerst buzzert, hat das Antwortrecht und nennt Titel und Interpret.","Falsch oder unvollständig? Dann darf das gegnerische Team ergänzen und den Punkt gewinnen.","Optional: Zusatzpunkt für das Erscheinungsjahr – maximal 4 Jahre Abweichung erlaubt."],
      win:"Das Team mit den meisten gewonnenen Runden bekommt die Steine.",mat:"2 Buzzer · Hitstar-App mit 30 Songs · Schmierblatt & Stift"}},
  order:"ABCDEF",

    {A:[7,12],B:[6,11],C:[1,9],D:[4,10],E:[5,8],F:[2,3]},
    {A:[3,5],B:[1,7],C:[2,8],D:[9,12],E:[6,10],F:[4,11]},

    {A:[4,6],B:[2,12],C:[10,11],D:[1,5],E:[3,7],F:[8,9]}],
  day:[
    ["09:00","Empfang mit Getränken im Foyer","Zieht einen Farbpunkt aus dem Säckchen und klebt ihn aufs Oberteil – das ist euer Team.",false],
    ["09:15","Alle in die Aula","",false],
    ["09:20","Auftakt in der Aula","Begrüßung, kurze Bewegungsrunde, Film mit allen Spielen, Erklärung des Ablaufs.",false],

const $=s=>document.querySelector(s), main=$('#main');
let team=null, view='lauf', cur=1;
try{const t=localStorage.getItem('ksbk-spiele-team'); if(t) team=+t; const c=localStorage.getItem('ksbk-spiele-runde'); if(c) cur=Math.min(7,Math.max(1,+c));}catch(e){}
function saveCur(){try{localStorage.setItem('ksbk-spiele-runde',cur)}catch(e){}}
const T=n=>DATA.teams[n-1];
const dot=(n,sz=24,fs=11)=>{const t=T(n);return `<span class="dot" style="background:${t.hex};color:${t.fg};width:${sz}px;height:${sz}px;font-size:${fs}px">${n}</span>`};
const esc=s=>s.replace(/</g,'&lt;');
function schedule(n){const out=[];DATA.plan.forEach((r,i)=>{for(const s of DATA.order){const p=r[s];if(p.includes(n))out.push({round:i+1,st:s,opp:p[0]===n?p[1]:p[0]})}});return out}
function hm(min){return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0')}
const START=(()=>{const[a,b]=DATA.start.split(':').map(Number);return a*60+b})();
function roundTime(i){return hm(START+(i-1)*DATA.roundMin)+' – '+hm(START+i*DATA.roundMin)}

function setView(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();window.scrollTo({top:0})}
function render(){
  const t=team?T(team):null;
  $('#teamDot').style.background=t?t.hex:'var(--card2)';$('#teamDot').style.color=t?t.fg:'inherit';$('#teamDot').textContent=t?team:'?';$('#teamLbl').textContent=t?t.name:'Mein Team';
  if(view==='lauf'){ if(!team) return renderPick(); return renderLauf(); }
  if(view==='plan') return renderPlan();
  if(view==='stat') return renderStat();
  if(view==='tag') return renderTag();
}
function renderPick(){
  main.innerHTML=`<span class="pill">Los geht's</span><h2>Welche Farbe hast du auf dem Oberteil?</h2><p class="lead">Tippe auf deinen Klebepunkt. Dann zeigt dir die Seite immer, wo dein Team als Nächstes hin muss.</p><div class="tap" style="margin:-8px 0 12px">Farbe antippen <span class="arr">→</span></div>
  <div class="tgrid">${DATA.teams.map(t=>`<button class="tbtn" data-t="${t.n}"><span class="dot d" style="background:${t.hex};color:${t.fg}">${t.n}</span><span><span class="n">${t.name}</span><span class="s">Team ${t.n}</span></span><span class="chev">›</span></button>`).join('')}</div>`;
  main.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{team=+b.dataset.t;cur=1;saveCur();try{localStorage.setItem('ksbk-spiele-team',team)}catch(e){};view='lauf';render()});
}
function renderLauf(){
  const t=T(team),sch=schedule(team);
  main.innerHTML=`<div id="now"></div><div style="display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px"><h2 style="margin:0;font-size:20px">Euer Weg durch die Halle</h2><span class="small">Team ${team} · ${t.name}</span></div><div class="stack" id="rounds"></div>
  <div class="note mt"><b>So läuft jede Runde:</b> 3 Min. Erklärung an der Station · 7 Min. Spielzeit, solange die Musik läuft · 5 Min. Wechsel. Die Uhrzeiten sind der Plan – maßgeblich ist die Ansage von Andrea. Die Runde ist zugleich die Zahl der Steine: Runde 1 = 1 Stein … Runde 6 = 6 Steine. Der Gewinner legt sie in seinen Becher. Nach Runde 6 bringt ihr den Becher zu Andrea.</div>`;
  const draw=()=>{
    const nowEl=$('#now');
    if(cur>6){nowEl.innerHTML=`<div class="now done"><div class="lab"><span>Alle 6 Runden gespielt</span></div><div class="big">Becher zu Andrea bringen</div><div class="sw" style="opacity:1;color:var(--muted)">Danach Pause · <b>11:45 Siegerehrung</b> in der Halle · 13:00 Lavendel</div><div class="row"><button class="chip" id="back">← Doch noch Runde 6</button></div></div>`;
      $('#back').onclick=()=>{cur=6;saveCur();draw()}}
    else{const e=sch[cur-1],st=DATA.stations[e.st],o=T(e.opp);
      nowEl.innerHTML=`<div class="now" style="background:${t.hex};color:${t.fg}"><div class="lab"><span>${cur===1?'Eure erste Station · Runde 1 von 6':'Jetzt · Runde '+cur+' von 6'}</span><span>${hm(START+(cur-1)*DATA.roundMin)} geplant</span></div>
      <div class="hd"><div class="big">${e.st}</div><div><div class="sn">${st.name}</div><div class="sw">${st.where}</div></div></div>
      <div class="row"><span class="chip">${dot(e.opp,18,10)} gegen Team ${e.opp} · ${o.name}</span><span class="chip">${cur} Stein${cur>1?'e':''}</span></div>
      <button class="next pulse" id="next">${cur<6?'Runde '+cur+' gespielt – weiter zu Runde '+(cur+1):'Runde 6 gespielt – zum Abschluss'} <span class="arr">→</span></button>${cur>1?`<button class="undo" id="back">← zurück zu Runde ${cur-1}</button>`:''}</div>`;
      $('#next').onclick=()=>{cur++;saveCur();draw();window.scrollTo({top:0,behavior:'smooth'})};
      const bk=$('#back');if(bk)bk.onclick=()=>{cur--;saveCur();draw()}}
    $('#rounds').innerHTML=sch.map(e=>{const st=DATA.stations[e.st];const cls=e.round<cur?'past':e.round===cur?'cur':'';
      return `<button class="rc ${cls}" data-s="${e.st}"><span class="r"><span class="k">RUNDE</span><span class="v">${e.round}</span><span class="t">${hm(START+(e.round-1)*DATA.roundMin)}</span></span><span class="s" style="background:${t.hex};color:${t.fg}">${e.st}</span><span class="i"><span class="sn">${st.name}</span><span class="sw">${st.where}</span><span class="op">gegen ${dot(e.opp,16,9)} <b>Team ${e.opp} · ${T(e.opp).name}</b><span class="st">${e.round} Stein${e.round>1?'e':''}</span></span><span class="hint">Antippen für die Spielregeln</span></span><span class="chev">›</span></button>`}).join('');
    main.querySelectorAll('.rc').forEach(b=>b.onclick=()=>openStation(b.dataset.s));
  };
  draw();
}
function renderPlan(){
  main.innerHTML=`<span class="pill">Sporthalle</span><h2>Der Hallenplan.</h2><p class="lead">Tippe auf den Plan, um ihn zu vergrößern. Die Buchstaben sind auch als Schilder an den Stationen angebracht.</p>
  <button class="hp" id="hpBtn" aria-label="Hallenplan vergrößern"><img src="${HP}" alt="Hallenplan mit Stationen A bis F"><span class="zl">Antippen zum Vergrößern</span></button>
  <div class="stack mt">${DATA.order.split('').map(s=>{const st=DATA.stations[s];return `<button class="sbtn" data-s="${s}"><span class="l">${s}</span><span><span class="n">${st.name}</span><br><span class="w">${st.where}</span></span><span class="chev">›</span></button>`}).join('')}</div>
  <div class="tap mt" style="margin-bottom:8px">Station antippen für die Regeln <span class="arr">→</span></div><div class="note mt"><b>Station F liegt im Nebenraum im Keller.</b> Folgt dem Pfeil zur Treppe – plant beim Wechsel dorthin eine Minute mehr ein.</div>`;
  $('#hpBtn').onclick=()=>{$('#zoomImg').src=HP;$('#zoom').classList.add('open')};
  main.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>openStation(b.dataset.s));
}
function renderStat(){
  main.innerHTML=`<span class="pill">Sechs Stationen</span><h2>Die Spiele.</h2><p class="lead">Kurz bevor ihr spielt, erklärt euch die Sportlehrkraft an der Station alles noch einmal. Hier könnt ihr vorher nachlesen.</p>
  <div class="stack">${DATA.order.split('').map(s=>{const st=DATA.stations[s];return `<button class="sbtn" data-s="${s}"><span class="l">${s}</span><span><span class="n">${st.name}</span><br><span class="w">${st.form} · ${st.where}</span></span><span class="chev">›</span></button>`}).join('')}</div>
  <div class="card mt"><b style="font-size:14px">Fair Play</b><p class="small" style="margin:6px 0 0">Haltet im Team eine Reihenfolge ein: Niemand spielt zweimal, bevor nicht alle einmal dran waren (Ausnahme: die Quiz-Stationen). Wechselt zügig – und habt Spaß.</p></div>`;
  main.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>openStation(b.dataset.s));
}
function renderTag(){
  const rows=DATA.plan.map((r,i)=>`<tr><td class="r">${i+1}<div style="font-size:10px;font-weight:600;opacity:.7">${hm(START+i*DATA.roundMin)}</div></td>${DATA.order.split('').map(s=>`<td>${dot(r[s][0],14,8)} <b>${r[s][0]}</b><span class="vs">vs</span>${dot(r[s][1],14,8)} <b>${r[s][1]}</b></td>`).join('')}</tr>`).join('');
  main.innerHTML=`<span class="pill">1. Oktober 2026</span><h2>Euer Tag.</h2>
  <div class="tl">${DATA.day.map(d=>`<div class="it"><div class="tm ${d[0].length>5?'sm':''}">${d[0]}</div><div class="bx ${d[3]?'hl':''}"><div class="t">${d[1]}</div>${d[2]?`<div class="s">${d[2]}</div>`:''}${d[0]==='13:00'?`<div style="margin-top:8px"><a class="linkbtn" href="https://maps.google.com/?q=Bonnstra%C3%9Fe+106,+50321+Br%C3%BChl" target="_blank" rel="noopener">In Karten öffnen ↗</a></div>`:''}</div></div>`).join('')}</div>
  <h2 class="mt" style="font-size:20px">Wertung</h2>
  <div class="card"><p style="margin:0 0 8px">Jede Runde ist ein Spiel gegen ein anderes Team. Der Gewinner bekommt so viele Steine, wie die Runde zählt:</p>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center">${[1,2,3,4,5,6].map(i=>`<div style="background:var(--card2);border-radius:10px;padding:8px 2px"><div style="font-size:10px;color:var(--muted);font-weight:700">R${i}</div><div style="font-size:20px;font-weight:800">${i}</div></div>`).join('')}</div>
  <p class="small" style="margin:10px 0 0">Maximal 21 Steine. Das Team mit den meisten Steinen wird <b>Karl-Schiller-Gewinnerteam</b>.</p></div>
  <h2 class="mt" style="font-size:20px">Spielplan aller Teams</h2><p class="small" style="margin:0 0 8px">Nach rechts wischen für alle Stationen.</p>
  <div class="tw"><table class="plan"><thead><tr><th>Runde</th>${DATA.order.split('').map(s=>`<th><b>${s}</b>${DATA.stations[s].name.replace('Gummischeiben-Weitwurf','Gummisch.')}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="mt" style="display:flex;gap:8px;flex-wrap:wrap"><button class="linkbtn" id="copyBtn">Link zu dieser Seite kopieren</button><button class="linkbtn" id="chgBtn">Team ändern</button></div>`;
  $('#copyBtn').onclick=async e=>{const b=e.currentTarget;try{await navigator.clipboard.writeText(location.href.split('#')[0]);b.textContent='Link kopiert ✓'}catch(err){b.textContent=location.href.split('#')[0]}};
  $('#chgBtn').onclick=()=>{team=null;cur=1;try{localStorage.removeItem('ksbk-spiele-team');localStorage.removeItem('ksbk-spiele-runde')}catch(e){};setView('lauf')};
}
function openStation(s){const st=DATA.stations[s];
  $('#sheet').innerHTML=`<div class="sh"><span class="pill">Station ${s} · ${st.form}</span><button class="close" id="shClose">Schließen</button></div>
  <div class="big">${s}</div><h3>${st.name}</h3><p class="desc">${st.desc}</p>
  <div class="mat" style="margin-bottom:4px"><b>Wo:</b> ${st.where}</div>
  <h4>So wird gespielt</h4><ol>${st.steps.map((x,i)=>`<li><span>${i+1}</span><div>${x}</div></li>`).join('')}</ol>
  <h4>So holt ihr die Steine</h4><p style="margin:0">${st.win}</p>
  <h4>Material</h4><div class="mat">${st.mat}</div>`;
  $('#scrim').classList.add('open');history.pushState({sheet:1},'');
  $('#shClose').onclick=closeSheet;}
function closeSheet(){$('#scrim').classList.remove('open');if(history.state&&history.state.sheet)history.back()}
$('#scrim').onclick=e=>{if(e.target===e.currentTarget)closeSheet()};
window.addEventListener('popstate',()=>{$('#scrim').classList.remove('open');$('#zoom').classList.remove('open')});
$('#zoomClose').onclick=()=>$('#zoom').classList.remove('open');
$('#teamBtn').onclick=()=>{team=null;cur=1;try{localStorage.removeItem('ksbk-spiele-team');localStorage.removeItem('ksbk-spiele-runde')}catch(e){};setView('lauf')};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
setView('lauf');
</script>

</body>
</html>
